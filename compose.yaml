services:
  sieve:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - sieve-data:/data
      - ./:/suites:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  sieve-data:
