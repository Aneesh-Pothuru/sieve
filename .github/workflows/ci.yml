name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make lint
      - run: make test
      - run: make demo
      - name: Confirm Pages entry and exact report
        run: |
          test -s docs/index.html
          test -s docs/demo/index.html
          python3 - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path("docs/demo/audit.json").read_text(encoding="utf-8"))
          assert audit["task_count"] == 20
          assert len(audit["findings"]) == 5
          PY
